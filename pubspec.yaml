name: anonapp
description: "Anonymous pseudonymous end-to-end encrypted chat application."
publish_to: 'none'
version: 1.0.9+9

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.8.4

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Secure Storage (mobile session persistence)
  flutter_secure_storage: ^9.2.4

  # Local persistence
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  shared_preferences: ^2.3.5

  # UI
  google_fonts: ^6.2.1
  intl: ^0.19.0
  timeago: ^3.7.0

  # Utilities
  uuid: ^4.5.1
  connectivity_plus: ^6.1.4
  web: ^1.1.1
  # Media & Voice
  image_picker: ^1.2.3
  file_picker: ^8.3.7
  record: ^5.2.0
  audioplayers: ^6.1.1
  # Notifications & Push
  flutter_local_notifications: ^22.3.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  cryptography: ^2.9.0
  flutter_foreground_task: ^11.0.3

dependency_overrides:
  record_linux: 1.3.1
  record_platform_interface: 1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.14
  freezed: ^2.5.8
  json_serializable: ^6.9.4
  riverpod_generator: ^2.6.3
  custom_lint: ^0.7.1
  riverpod_lint: ^2.6.3

  # Testing
  mocktail: ^1.0.4

  # App icons
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "logo.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "logo.png"
  web:
    generate: true
    image_path: "logo.png"
    background_color: "#0F0F1A"
    theme_color: "#6C63FF"
