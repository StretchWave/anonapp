name: anonapp
description: "Anonymous pseudonymous end-to-end encrypted chat application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.8.4

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Secure Storage (mobile session persistence)
  flutter_secure_storage: ^9.2.4

  # Local persistence
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  shared_preferences: ^2.3.5

  # UI
  google_fonts: ^6.2.1
  intl: ^0.19.0
  timeago: ^3.7.0

  # Utilities
  uuid: ^4.5.1
  connectivity_plus: ^6.1.4
  web: ^1.1.1
  # Media & Voice
  image_picker: ^1.2.3
  record: ^5.2.0
  audioplayers: ^6.1.1
  flutter_local_notifications: ^22.3.0
  cryptography: ^2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.14
  freezed: ^2.5.8
  json_serializable: ^6.9.4
  riverpod_generator: ^2.6.3
  custom_lint: ^0.7.1
  riverpod_lint: ^2.6.3

  # Testing
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
